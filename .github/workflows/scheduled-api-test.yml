name: Scheduled API Test

on:
  schedule:
    # Run daily at 6 AM UTC
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      api_key:
        description: "NanoGPT API Key (optional)"
        required: false
        type: string

jobs:
  test-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Test API connectivity
        run: |
          # Test if the API endpoint is reachable
          curl -sSf -o /dev/null \
            -H "Authorization: Bearer ${{ secrets.NANOGPT_API_KEY || inputs.api_key || 'test-key' }}" \
            "https://nano-gpt.com/api/v1/models?detailed=true" \
            && echo "✓ API endpoint is reachable" \
            || (echo "✗ API endpoint failed" && exit 1)

      - name: Run API tests
        env:
          NANOGPT_API_KEY: ${{ secrets.NANOGPT_API_KEY || inputs.api_key }}
        run: |
          if [ -n "$NANOGPT_API_KEY" ]; then
            echo "Running API tests with real API key..."
            bun test src/api/nanogpt.test.ts
          else
            echo "No API key provided, running mock tests only..."
            bun test src/api/nanogpt.test.ts
          fi

      - name: Test model transformation
        run: |
          bun -e "
          import { transformApiModel } from './dist/api/nanogpt.js';
          const testModel = {
            id: 'test-model',
            name: 'Test Model',
            context_length: 128000,
            max_output_tokens: 4096,
            capabilities: { reasoning: true, vision: false },
            pricing: { input: 0.001, output: 0.002 },
            created: 1704067200
          };
          const result = transformApiModel(testModel);
          console.log('✓ Model transformation works');
          console.log('Sample output:', JSON.stringify(result, null, 2));
          "

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issueTitle = '🚨 NanoGPT API Test Failed';
            const issueBody = `API test failed at ${new Date().toISOString()}

            **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            The NanoGPT API may have changed. Please check:
            1. API endpoint structure
            2. Authentication requirements
            3. Response format

            @${{ github.repository_owner }}`;

            // Check if issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'api-failure'
            });

            const existingIssue = issues.data.find(i => i.title === issueTitle);

            if (!existingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: issueTitle,
                body: issueBody,
                labels: ['api-failure', 'automated']
              });
              console.log('Created new issue for API failure');
            } else {
              console.log('Issue already exists:', existingIssue.html_url);
            }
